<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>SETTL — Sign in</title>
  <link rel="stylesheet" href="../../css/app.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">SETTL</div>
    <div class="auth-sub">Sign in to your account</div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" id="email" type="email" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="password" type="password" />
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Sign in</button>
    <p style="text-align:center;margin-top:16px;">
      No account? <a href="register.html">Create one</a>
    </p>
  </div>
</div>
<script src="../../js/modules/api.js"></script>
<script src="../../js/modules/auth.js"></script>
<script src="../../js/modules/toast.js"></script>
<script>
  if (auth.isLoggedIn()) window.location.href = '/pages/dashboard.html';

  async function doLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
      toast.error('Email and password required');
      return;
    }
    
    try {
      const { user, session } = await api.auth.login(email, password);
      auth.setSession(session, user);
      window.location.href = '/pages/dashboard.html';
    } catch(err) {
      toast.error(err.message);
    }
  }
</script>
</body>
</html>
